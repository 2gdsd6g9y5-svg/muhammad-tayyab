<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173650" />
      <stop offset="100%" stop-color="#10263D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="50%" stop-color="#F9F1D0" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Dark Circle Badge -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)" />
  
  <!-- Inner Delicate Concentric Ring -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3, 2" opacity="0.7" />
  <circle cx="80" cy="80" r="66" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9" />

  <!-- Stars at top (Representation of European standards & clarity) -->
  <g fill="url(#goldGrad)" transform="translate(80, 24)">
    <polygon points="0,-3.5 1.1,-1 3.5,-1 1.6,0.6 2.3,3 0,1.5 -2.3,3 -1.6,0.6 -3.5,-1 -1.1,-1" transform="scale(0.85)"/>
    <polygon points="0,-3.5 1.1,-1 3.5,-1 1.6,0.6 2.3,3 0,1.5 -2.3,3 -1.6,0.6 -3.5,-1 -1.1,-1" transform="translate(-14, 2) scale(0.65)"/>
    <polygon points="0,-3.5 1.1,-1 3.5,-1 1.6,0.6 2.3,3 0,1.5 -2.3,3 -1.6,0.6 -3.5,-1 -1.1,-1" transform="translate(14, 2) scale(0.65)"/>
  </g>

  <!-- Classical Laurel Branches on sides -->
  <!-- Left Branch -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.85">
    <path d="M 32 88 C 30 70, 36 50, 48 38" />
    <!-- Leaves -->
    <path d="M 33 80 C 27 78, 26 72, 33 75 Z" fill="url(#goldGrad)" />
    <path d="M 31 68 C 24 65, 25 59, 32 63 Z" fill="url(#goldGrad)" />
    <path d="M 33 56 C 27 51, 30 46, 36 51 Z" fill="url(#goldGrad)" />
    <path d="M 39 46 C 34 40, 39 35, 43 41 Z" fill="url(#goldGrad)" />
  </g>
  <!-- Right Branch -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.85">
    <path d="M 128 88 C 130 70, 124 50, 112 38" />
    <!-- Leaves -->
    <path d="M 127 80 C 133 78, 134 72, 127 75 Z" fill="url(#goldGrad)" />
    <path d="M 129 68 C 136 65, 135 59, 128 63 Z" fill="url(#goldGrad)" />
    <path d="M 127 56 C 133 51, 130 46, 124 51 Z" fill="url(#goldGrad)" />
    <path d="M 121 46 C 126 40, 121 35, 117 41 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Central Interlocking Classical Monogram 'I I' -->
  <g fill="url(#goldLight)" filter="url(#shadow)">
    <!-- First 'I' (Left) -->
    <!-- Top Serif -->
    <rect x="52" y="44" width="22" height="3.5" rx="0.5" />
    <!-- Vertical Column -->
    <rect x="59.5" y="44" width="7" height="52" rx="0.5" />
    <!-- Bottom Serif -->
    <rect x="52" y="92.5" width="22" height="3.5" rx="0.5" />

    <!-- Second 'I' (Right) -->
    <!-- Top Serif -->
    <rect x="86" y="44" width="22" height="3.5" rx="0.5" />
    <!-- Vertical Column -->
    <rect x="93.5" y="44" width="7" height="52" rx="0.5" />
    <!-- Bottom Serif -->
    <rect x="86" y="92.5" width="22" height="3.5" rx="0.5" />
  </g>

  <!-- Central Connecting Roman Crossbar / Key (Symbolizing bridging & legal pathway) -->
  <rect x="66" y="68" width="28" height="2" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="80" cy="69" r="2.5" fill="url(#goldLight)" />

  <!-- Italian Tricolor Subtle Micro-Ribbon at Bottom -->
  <g transform="translate(62, 114)">
    <!-- Green -->
    <rect x="0" y="0" width="12" height="3.5" rx="1" fill="#009246" />
    <!-- White -->
    <rect x="12" y="0" width="12" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <!-- Red -->
    <rect x="24" y="0" width="12" height="3.5" rx="1" fill="#CE2B37" />
  </g>

  <!-- Inscription Arc: MILANO -->
  <text x="80" y="132" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="7.5" font-weight="600" fill="url(#goldGrad)" letter-spacing="3.2">MILANO</text>
  <text x="80" y="141" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="4.2" font-weight="500" fill="#E7DED4" letter-spacing="1.5" opacity="0.8">IMMIGRAZIONE</text>
</svg>
